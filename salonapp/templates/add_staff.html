<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Staff | Aura Admin</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --dark-navy: #0F171E;      /* Sidebar Background */
            --main-navy: #16202A;      /* Content Background */
            --salmon: #C68D77;         /* Accent Color */
            --white: #FFFFFF;
            --text-muted: rgba(255, 255, 255, 0.6);
            --glass: rgba(255, 255, 255, 0.03);
            --sidebar-width: 280px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--main-navy);
            /* Matching abstract pattern */
            background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><path d="M0 100 Q 50 50 100 100" stroke="rgba(198, 141, 119, 0.05)" fill="none" stroke-width="0.5"/></svg>');
            color: var(--white);
            display: flex;
            min-height: 100vh;
        }

        /* ================= SIDEBAR ================= */
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            background-color: var(--dark-navy);
            padding: 2.5rem 1.5rem;
            position: fixed;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 1000;
        }

        .brand-section {
            text-align: center;
            margin-bottom: 3rem;
        }

        .brand-name {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            letter-spacing: 4px;
            color: var(--salmon);
            text-transform: uppercase;
        }

        .brand-sub {
            font-size: 0.7rem;
            letter-spacing: 3px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-top: 5px;
        }

        .nav-group {
            flex-grow: 1;
        }

        .nav-link {
            text-decoration: none;
            display: block;
            margin-bottom: 12px;
        }

        .nav-btn {
            width: 100%;
            padding: 1rem 1.2rem;
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--white);
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: 0.3s;
        }

        .nav-btn:hover, .active-btn {
            background: rgba(198, 141, 119, 0.1);
            border-color: var(--salmon);
        }

        .btn-add-staff::before { content: '👤+'; font-size: 1.2rem; color: var(--salmon); margin-right: 10px; }

        .logout-section {
            margin-top: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1.5rem;
        }

        .btn-logout {
            width: 100%;
            padding: 1rem;
            background: transparent;
            border: 1px solid rgba(198, 141, 119, 0.3);
            color: var(--salmon);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            font-family: 'Outfit', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .btn-logout:hover {
            background: var(--salmon);
            color: var(--white);
        }

        /* ================= CONTENT ================= */
        .content {
            margin-left: var(--sidebar-width);
            flex-grow: 1;
            padding: 4rem 8%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .form-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .form-title {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 400;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: var(--salmon);
            margin: 10px auto 0;
        }

        form {
            background: rgba(255, 255, 255, 0.02);
            padding: 3rem;
            border-radius: 12px;
            width: 100%;
            max-width: 700px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--salmon);
            margin-bottom: 10px;
            font-weight: 600;
        }

        input[type="text"], 
        input[type="password"], 
        input[type="email"], 
        input[type="number"] {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: var(--white);
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--salmon);
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-submit {
            width: 100%;
            padding: 1rem;
            background: var(--salmon);
            color: var(--white);
            border: none;
            border-radius: 6px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 1rem;
        }

        .btn-submit:hover {
            background: #be8e78;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="brand-section">
        <h1 class="brand-name">AURA</h1>
        <p class="brand-sub">Admin Panel</p>
    </div>
    <nav class="nav-group">
        <a href="{% url 'add_service' %}" class="nav-link">
            <button class="nav-btn btn-add-service active-btn">Add Service</button>
        </a>

        <a href="{% url 'admin_view_services' %}" class="nav-link">
            <button class="nav-btn btn-view-services">View Services</button>
        </a>

        <a href="{% url 'add_staff' %}" class="nav-link">
            <button class="nav-btn btn-add-staff active-btn">Add Staff</button>
        </a>
    

        <a href="{% url 'view_customers' %}" class="nav-link">
            <button class="nav-btn btn-view-customers">View Customers</button>
        </a>

        <a href="{% url 'view_staff' %}" class="nav-link">
            <button class="nav-btn btn-view-staff">View Staff</button>
        </a>
      </nav>  
    <div class="logout-section">
        <a href="{% url 'logout' %}" class="btn-logout">↩ Logout</a>
    </div>
</aside>

<main class="content">
    <div class="form-header">
        <h2 class="form-title">Onboard New Staff</h2>
        <div class="divider"></div>
    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="input-grid">
            <div class="input-group">
                <label class="input-label">Staff Username</label>
                <input type="text" name="username" placeholder="Enter name" required>
            </div>
            <div class="input-group">
                <label class="input-label">Security Password</label>
                <input type="password" name="password" placeholder="Set password" required>
            </div>
        </div>

        <div class="input-grid">
            <div class="input-group">
                <label class="input-label">Email Address</label>
                <input type="email" name="email" placeholder="email@aura.com" required>
            </div>
            <div class="input-group">
                <label class="input-label">Phone Number</label>
                <input type="text" name="phone" placeholder="+91 00000 00000" required>
            </div>
        </div>

        <div class="input-grid">
            <div class="input-group">
                <label class="input-label">Service Expertise</label>
                <input type="text" name="service_type" placeholder="e.g. Skin Care" required>
            </div>
            <div class="input-group">
                <label class="input-label">Years of Experience</label>
                <input type="number" name="experience" placeholder="e.g. 5">
            </div>
        </div>

        <button type="submit" class="btn-submit">Add Staff Member &nbsp; 👤+</button>
    </form>
</main>

</body>
</html>
