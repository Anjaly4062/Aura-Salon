<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | AURA</title>
    <style>
        :root {
            --aura-navy: #1a2a3a;
            --aura-coral: #d48b78;
            --aura-bg: #f8f4f1;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--aura-bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            width: 350px;
            padding: 40px;
            background: var(--white);
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
        }

        .logo-text {
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 4px;
            color: var(--aura-navy);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        h2 {
            font-family: serif;
            font-weight: normal;
            margin-bottom: 30px;
            color: var(--aura-navy);
        }

        input {
            width: 100%;
            padding: 12px 0;
            margin: 10px 0;
            border: none;
            border-bottom: 1px solid #ddd;
            font-size: 0.9rem;
            outline: none;
            box-sizing: border-box;
        }

        input:focus {
            border-bottom: 1px solid var(--aura-coral);
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background-color: var(--aura-navy);
            color: white;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.3s;
        }

        button:hover {
            background-color: var(--aura-coral);
        }

        .error {
            color: #b33a3a;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }

        .switch-link {
            margin-top: 20px;
            font-size: 0.85rem;
        }

        .switch-link a {
            color: var(--aura-coral);
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="login-box">
    <div class="logo-text">AURA</div>
    <h2>Welcome Back</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Sign In</button>
    </form>

    <div class="switch-link">
        Don't have an account? <a href="{% url 'register' %}">Create one</a>
    </div>
</div>

</body>
</html>
