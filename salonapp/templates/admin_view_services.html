<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Services | Aura Admin</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --dark-navy: #0F171E;      /* Sidebar Background */
            --main-navy: #16202A;      /* Content Background */
            --salmon: #C68D77;         /* Accent Color */
            --white: #FFFFFF;
            --text-muted: rgba(255, 255, 255, 0.6);
            --glass: rgba(255, 255, 255, 0.03);
            --sidebar-width: 280px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--main-navy);
            background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><path d="M0 100 Q 50 50 100 100" stroke="rgba(198, 141, 119, 0.05)" fill="none" stroke-width="0.5"/></svg>');
            color: var(--white);
            display: flex;
            min-height: 100vh;
        }

        /* ================= SIDEBAR ================= */
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            background-color: var(--dark-navy);
            padding: 2.5rem 1.5rem;
            position: fixed;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 1000;
        }

        .brand-section {
            text-align: center;
            margin-bottom: 3rem;
        }

        .brand-name {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            letter-spacing: 4px;
            color: var(--salmon);
            text-transform: uppercase;
        }

        .brand-sub {
            font-size: 0.7rem;
            letter-spacing: 3px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-top: 5px;
        }

        .nav-group {
            flex-grow: 1;
        }

        .nav-link {
            text-decoration: none;
            display: block;
            margin-bottom: 12px;
        }

        .nav-btn {
            width: 100%;
            padding: 1rem 1.2rem;
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--white);
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: 0.3s;
        }

        .nav-btn:hover, .active-btn {
            background: rgba(198, 141, 119, 0.1);
            border-color: var(--salmon);
        }

        .nav-btn::before {
            font-size: 1.2rem;
            color: var(--salmon);
        }

        .btn-add-service::before { content: '➕'; }
        .btn-view-services::before { content: '📋'; }
        .btn-add-staff::before { content: '👤+'; }
        .btn-view-customers::before { content: '👥'; }
        .btn-view-staff::before { content: '👔'; }
         .logout-section {
            margin-top: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1.5rem;
        }

        .btn-logout {
            width: 100%;
            padding: 1rem;
            background: transparent;
            border: 1px solid rgba(198, 141, 119, 0.3);
            color: var(--salmon);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
        }

        .btn-logout:hover {
            background: var(--salmon);
            color: var(--white);
        }

        /* ================= MAIN CONTENT ================= */
        .content {
            margin-left: var(--sidebar-width);
            flex-grow: 1;
            padding: 4rem 5%;
        }

        .page-header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            margin-bottom: 0.5rem;
            font-weight: 400;
        }

        .divider {
            width: 80px;
            height: 2px;
            background: var(--salmon);
            margin: 0 auto;
        }

        /* ================= SERVICES GRID ================= */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        .service-card {
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 2.5rem 2rem;
            backdrop-filter: blur(10px);
            transition: all 0.4s ease;
            display: flex;
            flex-direction: column;
            text-align: center;
        }

        .service-card:hover {
            transform: translateY(-10px);
            border-color: var(--salmon);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        .card-icon {
            font-size: 1.5rem;
            color: var(--salmon);
            margin-bottom: 1rem;
        }

        .service-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: var(--white);
        }

        .card-divider {
            width: 40px;
            height: 1px;
            background: var(--salmon);
            margin: 0 auto 1.5rem;
            opacity: 0.5;
        }

        .price {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--salmon);
            margin-bottom: 1rem;
        }

        .description {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 2rem;
            flex-grow: 1;
        }

        /* ACTIONS */
        .card-actions {
            display: flex;
            gap: 15px;
            margin-top: auto;
        }

        .card-actions a {
            flex: 1;
            text-decoration: none;
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
            border: none;
        }

        .edit-btn {
            background: var(--white);
            color: var(--dark-navy);
        }

        .edit-btn:hover {
            background: var(--salmon);
            color: var(--white);
                }
        .delete-btn {
            background: rgba(220, 53, 69, 0.1); /* Very soft red tint */
            border: 1px solid rgba(220, 53, 69, 0.4);
            color: #ff5f6d; /* Lighter, more modern red */
        }

        .delete-btn:hover {
            background: #dc3545;
            border-color: #dc3545;
            color: var(--white);
            box-shadow: 0 4px 12px rgba(220, 53, 69, 0.3);
        }

    </style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
    <div class="brand-section">
        <h1 class="brand-name">AURA</h1>
        <p class="brand-sub">Admin Panel</p>
    </div>

    <nav class="nav-group">
        <a href="{% url 'add_service' %}" class="nav-link">
            <button class="nav-btn btn-add-service">Add Service</button>
        </a>

        <a href="{% url 'admin_view_services' %}" class="nav-link">
            <button class="nav-btn btn-view-services active-btn">View Services</button>
        </a>

        <a href="{% url 'add_staff' %}" class="nav-link">
            <button class="nav-btn btn-add-staff">Add Staff</button>
        </a>

        <a href="{% url 'view_customers' %}" class="nav-link">
            <button class="nav-btn btn-view-customers">View Customers</button>
        </a>

        <a href="{% url 'view_staff' %}" class="nav-link">
            <button class="nav-btn btn-view-staff">View Staff</button>
        </a>
    </nav>
    <div class="logout-section">
        <a href="{% url 'logout' %}"></a>
        <button class="btn-logout"><span>↩</span> Logout</button>
    </div>
</aside>

<!-- MAIN CONTENT -->
<main class="content">
    <div class="page-header">
        <h2 class="page-title">Manage Services</h2>
        <div class="divider"></div>
    </div>

    <div class="services-grid">
        {% for s in services %}
        <div class="service-card">
            <div class="card-icon">🌿</div>
            <h3 class="service-name">{{ s.service_name }}</h3>
            <div class="card-divider"></div>
            
            <div class="price">₹ {{ s.price }}</div>
            <p class="description">{{ s.description|truncatewords:20 }}</p>

            <div class="card-actions">
                <a href="{% url 'edit_service' s.id %}">
                    <button class="action-btn edit-btn">Update</button>
                </a>
                <a href="{% url 'delete_service' s.id %}" onclick="return confirm('Are you sure you want to delete this service?')">
                    <button class="action-btn delete-btn">Delete</button>
                </a>
            </div>
        </div>
        {% endfor %}
    </div>
</main>

</body>
</html>
