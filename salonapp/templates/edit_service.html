<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Service | Aura Admin</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --dark-navy: #0F171E;      /* Sidebar Background */
            --main-navy: #16202A;      /* Content Background */
            --salmon: #C68D77;         /* Accent Color */
            --white: #FFFFFF;
            --text-muted: rgba(255, 255, 255, 0.6);
            --glass: rgba(255, 255, 255, 0.03);
            --sidebar-width: 280px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--main-navy);
            background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><path d="M0 100 Q 50 50 100 100" stroke="rgba(198, 141, 119, 0.05)" fill="none" stroke-width="0.5"/></svg>');
            color: var(--white);
            display: flex;
            min-height: 100vh;
        }

        /* ================= SIDEBAR ================= */
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            background-color: var(--dark-navy);
            padding: 2.5rem 1.5rem;
            position: fixed;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 1000;
        }

        .brand-section {
            text-align: center;
            margin-bottom: 3rem;
        }

        .brand-name {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            letter-spacing: 4px;
            color: var(--salmon);
            text-transform: uppercase;
        }

        .brand-sub {
            font-size: 0.7rem;
            letter-spacing: 3px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-top: 5px;
        }

        .nav-group {
            flex-grow: 1;
        }

        .nav-link {
            text-decoration: none;
            display: block;
            margin-bottom: 12px;
        }

        .nav-btn {
            width: 100%;
            padding: 1rem 1.2rem;
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--white);
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: 0.3s;
        }

        .nav-btn:hover {
            background: rgba(198, 141, 119, 0.1);
            border-color: var(--salmon);
        }

        .nav-btn::before {
            font-size: 1.2rem;
            color: var(--salmon);
        }

        .btn-add-service::before { content: '➕'; }
        .btn-view-services::before { content: '📋'; }

        .logout-section {
            margin-top: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1.5rem;
        }

        .btn-logout {
            width: 100%;
            padding: 1rem;
            background: transparent;
            border: 1px solid rgba(198, 141, 119, 0.3);
            color: var(--salmon);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
        }

        .btn-logout:hover {
            background: var(--salmon);
            color: var(--white);
        }

        /* ================= CONTENT ================= */
        .content {
            margin-left: var(--sidebar-width);
            flex-grow: 1;
            padding: 4rem 8%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .form-header {
            text-align: center;
            margin-bottom: 3rem;
            width: 100%;
        }

        .form-title {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            margin-bottom: 0.5rem;
            font-weight: 400;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: var(--salmon);
            margin: 0 auto 2rem;
        }

        form {
            background: rgba(255, 255, 255, 0.02);
            padding: 3rem;
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--salmon);
            margin-bottom: 8px;
            font-weight: 600;
        }

        input[type="text"], 
        input[type="number"], 
        textarea {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: var(--white);
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            border-color: var(--salmon);
            background: rgba(255, 255, 255, 0.08);
        }

        textarea {
            resize: vertical;
        }

        .action-group {
            display: flex;
            gap: 15px;
            margin-top: 1.5rem;
        }

        button[type="submit"] {
            flex: 2;
            padding: 1rem;
            background: var(--salmon);
            color: var(--white);
            border: none;
            border-radius: 6px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
        }

        button[type="submit"]:hover {
            background: #be8e78;
            transform: translateY(-2px);
        }

        .back-btn {
            flex: 1;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            color: var(--white);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            text-decoration: none;
            text-align: center;
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--text-muted);
        }

    </style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
    <div class="brand-section">
        <h1 class="brand-name">AURA</h1>
        <p class="brand-sub">Staff Panel</p>
    </div>

    <nav class="nav-group">
        <a href="{% url 'add_service' %}" class="nav-link">
            <button class="nav-btn btn-add-service">Add Service</button>
        </a>

        <a href="{% url 'admin_view_services' %}" class="nav-link">
            <button class="nav-btn btn-view-services">View Services</button>
        </a>
    </nav>

    <div class="logout-section">
        <button class="btn-logout"><span>↩</span> Logout</button>
    </div>
</aside>

<!-- CONTENT -->
<main class="content">
    <div class="form-header">
        <h2 class="form-title">Edit Service</h2>
        <div class="divider"></div>
    </div>

    <form method="POST">
        {% csrf_token %}
        
        <div class="input-group">
            <label class="input-label">Service Name</label>
            <input type="text" name="service_name" value="{{ service.service_name }}" placeholder="Service Name">
        </div>

        <div class="input-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div>
                <label class="input-label">Price (₹)</label>
                <input type="number" name="price" value="{{ service.price }}" placeholder="0">
            </div>
            <div>
                <label class="input-label">Duration (Mins)</label>
                <input type="number" name="duration" value="{{ service.duration }}" placeholder="0">
            </div>
        </div>

        <div class="input-group">
            <label class="input-label">Service Description</label>
            <textarea name="description" placeholder="Describe the service..." rows="5">{{ service.description }}</textarea>
        </div>

        <div class="action-group">
            <button type="submit">Update Service &nbsp; ✨</button>
            <a href="{% url 'admin_view_services' %}" class="back-btn">Cancel</a>
        </div>
    </form>
</main>

</body>
</html>
